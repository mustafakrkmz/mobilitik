[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilitik"
version = "0.1.0"
description = "Mobilya sektörü tüketici şikayetleri araştırma ve analiz platformu"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mobilitik Contributors" }]
dependencies = [
    "scrapy>=2.11,<3",
    "scrapy-playwright>=0.0.34,<1",
    "playwright>=1.46,<2",
    "python-dateutil>=2.9,<3",
    "PySide6>=6.7,<7",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
]
nlp = [
    "torch",
    "transformers>=4.46,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
