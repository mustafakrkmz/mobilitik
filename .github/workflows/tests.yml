name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=mobilitik --cov-report=term-missing --cov-fail-under=85

  windows-smoke:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the real Windows installer
        shell: cmd
        run: install_windows.bat
      - name: Install test runner in Mobilitik venv
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install "pytest>=8,<9"
      - name: Run Windows desktop and data smoke tests
        shell: pwsh
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_gui_smoke.py
          tests/test_spider_parsing.py
          tests/test_repository.py
          tests/test_pipeline.py
          tests/test_timing.py
