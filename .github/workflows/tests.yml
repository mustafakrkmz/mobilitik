name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest -q --cov=mobilitik --cov-report=term-missing --cov-fail-under=85

  windows-smoke:
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the real Windows installer
        shell: cmd
        run: install_windows.bat
      - name: Install test runner in Mobilitik venv
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pip install "pytest>=8,<9"
      - name: Run Windows desktop and data smoke tests
        shell: pwsh
        run: >-
          .\.venv\Scripts\python.exe -m pytest -q
          tests/test_gui_smoke.py
          tests/test_spider_parsing.py
          tests/test_repository.py
          tests/test_pipeline.py
          tests/test_timing.py

  live-site-smoke:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-smoke]')
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Inspect current public complaint DOM
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://www.sikayetvar.com/istikbal?page=1', wait_until='domcontentloaded', timeout=60000)
              page.wait_for_timeout(2500)
              print('TITLE:', page.title())
              print('ARTICLE_COUNT:', page.locator('article').count())
              for i in range(min(page.locator('article').count(), 12)):
                  node = page.locator('article').nth(i)
                  print('ARTICLE', i, 'CLASS=', node.get_attribute('class'))
                  print('TEXT=', ' '.join(node.inner_text().split())[:280])
                  links = node.locator('a')
                  for j in range(min(links.count(), 4)):
                      print('  LINK', j, links.nth(j).get_attribute('href'), '::', ' '.join(links.nth(j).inner_text().split())[:140])
              print('H2_COUNT:', page.locator('h2').count())
              for i in range(min(page.locator('h2').count(), 20)):
                  node = page.locator('h2').nth(i)
                  link = node.locator('a').first
                  href = link.get_attribute('href') if link.count() else None
                  print('H2', i, 'CLASS=', node.get_attribute('class'), 'HREF=', href, 'TEXT=', ' '.join(node.inner_text().split())[:180])
              candidates = page.locator('a[href^="/istikbal/"]')
              print('ISTIKBAL_LINK_COUNT:', candidates.count())
              for i in range(min(candidates.count(), 40)):
                  node = candidates.nth(i)
                  print('CANDIDATE', i, node.get_attribute('href'), 'CLASS=', node.get_attribute('class'), 'TEXT=', ' '.join(node.inner_text().split())[:180])
              browser.close()
          PY
      - name: Crawl one public listing page
        run: |
          rm -f mobilitik.db
          scrapy crawl complaints -a company=istikbal -a max_pages=1 -s LOG_LEVEL=INFO
      - name: Assert that live complaints were stored
        run: |
          python - <<'PY'
          import sqlite3

          with sqlite3.connect('mobilitik.db') as conn:
              count = conn.execute('SELECT COUNT(*) FROM complaints').fetchone()[0]
          print(f'Live smoke collected {count} complaints')
          raise SystemExit(0 if count > 0 else 1)
          PY
